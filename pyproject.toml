[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soulseek-auto-tool"
version = "0.1.0"
description = "Pull tracks from a SoundCloud playlist, review the search terms, and search them on Soulseek via slskd."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yt-dlp",
    "anthropic>=0.40",
    "httpx>=0.27",
    "rich>=13",
    "python-dotenv>=1",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slsk-auto = "soulseek_auto_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
